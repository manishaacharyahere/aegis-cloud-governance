# NATS for Aegis: JetStream on, anonymous access off.
# The aegis_api user may publish domain events (aegis.>), create and read the
# AEGIS_EVENTS stream and its consumers, fetch and acknowledge messages, and
# nothing else: no purging, deleting or reading other streams. It receives
# only replies on its inbox. The password comes from NATS_API_PASSWORD.
port: 4222
http_port: 8222

jetstream {
  store_dir: /data
}

authorization {
  users = [
    {
      user: aegis_api
      password: $NATS_API_PASSWORD
      permissions: {
        publish: [
          "aegis.>",
          "$JS.API.INFO",
          "$JS.API.STREAM.CREATE.AEGIS_EVENTS",
          "$JS.API.STREAM.UPDATE.AEGIS_EVENTS",
          "$JS.API.STREAM.INFO.AEGIS_EVENTS",
          "$JS.API.CONSUMER.CREATE.AEGIS_EVENTS.>",
          "$JS.API.CONSUMER.DURABLE.CREATE.AEGIS_EVENTS.>",
          "$JS.API.CONSUMER.INFO.AEGIS_EVENTS.>",
          "$JS.API.CONSUMER.MSG.NEXT.AEGIS_EVENTS.>",
          "$JS.ACK.AEGIS_EVENTS.>"
        ]
        subscribe: ["_INBOX.>"]
      }
    }
  ]
}
