# NATS for Aegis: JetStream on, anonymous access off.
# The aegis_api user may publish domain events (aegis.>), use the JetStream API
# and acknowledge messages it consumes; it receives only replies on its inbox.
# The password comes from the NATS_API_PASSWORD environment variable.
port: 4222
http_port: 8222

jetstream {
  store_dir: /data
}

authorization {
  users = [
    {
      user: aegis_api
      password: $NATS_API_PASSWORD
      permissions: {
        publish: ["aegis.>", "$JS.API.>", "$JS.ACK.>"]
        subscribe: ["_INBOX.>"]
      }
    }
  ]
}
