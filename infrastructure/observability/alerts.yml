# Alerts for the Aegis platform (loaded by the observability profile).
# Names follow the OpenTelemetry-to-Prometheus conversion: units become
# suffixes (seconds), counters end in _total.
groups:
  - name: aegis
    rules:
      - alert: AegisJobNotSucceeding
        # Retention runs hourly and the scheduled evaluation every 6 h by
        # default; no success in 2x the longer period means it is stuck or failing.
        expr: time() - aegis_job_last_success_seconds > 12 * 3600
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Background job {{ $labels.job }} has not succeeded for over 12 hours"
      - alert: AegisJobFailing
        expr: increase(aegis_job_runs_total{outcome="failure"}[1h]) > 3
        labels: { severity: warning }
        annotations:
          summary: "Background job {{ $labels.job }} failed more than 3 times in an hour"
      - alert: AegisScansWaiting
        # No worker is taking scans (or all are busy) for 10 minutes.
        expr: aegis_iac_queue_oldest_queued_seconds > 600
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "An IaC scan has waited more than 10 minutes"
      - alert: AegisOutboxParked
        expr: aegis_outbox_parked > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Outbox events were refused by the broker and parked; requeue after fixing the cause"
      - alert: AegisHighErrorRate
        expr: sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m])) / sum(rate(http_server_request_duration_seconds_count[5m])) > 0.05
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "More than 5% of API requests fail with 5xx"
