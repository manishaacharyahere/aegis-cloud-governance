global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: aegis-api
    static_configs:
      - targets: ["api:9464"]
  # The IaC worker runs on the host (AEGIS_WORKER_METRICS_ADDR=:9465).
  - job_name: aegis-worker
    static_configs:
      - targets: ["host.docker.internal:9465"]
