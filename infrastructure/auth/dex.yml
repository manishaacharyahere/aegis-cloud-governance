# Local development identity provider (Dex) for the "auth" Compose profile.
#
# DEVELOPMENT ONLY. Every demo user's password is "aegis-dev-only". The
# password grant is enabled so scripts and tests can obtain tokens. Never use
# this file, these users or this password anywhere real.
#
# The issuer uses dex.localhost, which browsers resolve to 127.0.0.1 and which
# the API container resolves to this service through a network alias, so the
# browser and the API see the same issuer URL.
issuer: http://dex.localhost:5556/dex

# SQLite on a volume: signing keys (and sessions) survive a Dex restart.
storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556
  allowedOrigins: ["http://127.0.0.1:5173", "http://localhost:5173"]

oauth2:
  skipApprovalScreen: true
  responseTypes: ["code"]
  passwordConnector: local

expiry:
  idTokens: "1h"

staticClients:
  - id: aegis-web
    name: Aegis
    public: true
    redirectURIs:
      - http://127.0.0.1:5173/callback
      - http://localhost:5173/callback

enablePasswordDB: true

staticPasswords:
