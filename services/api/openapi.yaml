components:
  securitySchemes:
    oidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC ID token (AEGIS_AUTH_MODE=oidc).
    devHeaders:
      type: apiKey
      in: header
      name: X-Aegis-Actor
      description: Development mode only, loopback clients only; every caller has every role.
  parameters:
    Tenant:
      name: X-Aegis-Tenant
      in: header
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9][a-z0-9-]{1,62}$
    TenantOptional:
      name: X-Aegis-Tenant
      in: header
      required: false
      schema:
        type: string
        pattern: ^[a-z0-9][a-z0-9-]{1,62}$
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    After:
      name: after
      in: query
      required: false
      description: Opaque cursor (next_cursor of the previous page).
      schema:
        type: string
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Replays within 24h return the stored response; reuse with a different body is 422.
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{1,128}$
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            issues:
              type: array
              items: *id001
    PublicKey:
      type: object
      properties:
        algorithm:
          type: string
        key_id:
          type: string
        public_key:
          type: string
    Membership:
      type: object
      required:
      - slug
      - name
      - roles
      properties:
        slug:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
            - viewer
            - analyst
            - approver
            - admin
    BindingChange:
      type: object
      required:
      - subject
      - role
      properties:
        subject:
          type: string
        role:
          type: string
          enum:
          - viewer
          - analyst
          - approver
          - admin
    PolicyConfig:
      type: object
      properties:
        approved_regions:
          type: array
          items:
            type: string
        required_tags:
          type: array
          items:
            type: string
        admin_ports:
          type: array
          items:
            type: integer
        approved_encryption:
          type: array
          items:
            type: string
    Account:
      type: object
      required:
      - id
      - provider
      - external_id
      - name
      - resource_count
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
        external_id:
          type: string
        name:
          type: string
        resource_count:
          type: integer
    TypeCount:
      type: object
      required:
      - resource_type
      - count
      properties:
        resource_type:
          type: string
        count:
          type: integer
    ScanRequest:
      type: object
      required:
      - source
      properties:
        source:
          type: object
          required:
          - type
          - ref
          properties:
            type:
              type: string
              enum:
              - fixture
            ref:
              type: string
              pattern: ^[a-z0-9][a-z0-9-]{0,62}$
    EvaluationRequest:
      type: object
      properties:
        source:
          type: string
          enum:
          - inventory
          - iac
        scan_id:
          type: string
    ExceptionRequest:
      type: object
      required:
      - rule_id
      - subject
      - justification
      - expires_at
      properties:
        rule_id:
          type: string
        subject:
          type: string
        justification:
          type: string
        expires_at:
          type: string
          format: date-time
    Comment:
      type: object
      properties:
        comment:
          type: string
    Weights:
      type: object
      properties:
        severity:
          type: number
        exposure:
          type: number
        privilege:
          type: number
        criticality:
          type: number
        data_sensitivity:
          type: number
