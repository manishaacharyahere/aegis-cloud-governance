# Generated once, then maintained by hand. TestOpenAPICoversRoutes checks it against routePermissions.
openapi: 3.1.0
info:
  title: AEGIS API
  version: 1.0.0
  description: Local-first cloud governance API. Every route lists the permission it needs in x-aegis-permission (public, signed = any authenticated
    caller, read, operate, approve, admin); see docs/auth.md for the role mapping.
  license:
    name: MIT
servers:
- url: http://127.0.0.1:8080
security:
- oidc: []
- devHeaders: []
tags:
- name: access
- name: audit
- name: compliance
- name: drift
- name: finops
- name: iac
- name: inventory
- name: investigator
- name: operations
- name: remediation
- name: risk
- name: system
- name: tenant
paths:
  /healthz:
    get:
      tags:
      - system
      summary: Liveness probe
      operationId: getHealthz
      x-aegis-permission: public
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        default:
          $ref: '#/components/responses/Error'
  /readyz:
    get:
      tags:
      - system
      summary: Readiness probe (database reachable)
      operationId: getReadyz
      x-aegis-permission: public
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        default:
          $ref: '#/components/responses/Error'
  /api/v1/version:
    get:
      tags:
      - system
      summary: Build version
      operationId: getVersion
      x-aegis-permission: public
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: &id001
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
  /api/v1/openapi.yaml:
    get:
      tags:
      - system
      summary: This document
      operationId: getOpenapiYaml
      x-aegis-permission: public
      security: []
      responses:
        '200':
          description: OK
          content:
            application/yaml:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/config:
    get:
      tags:
      - access
      summary: Authentication mode, issuer and client ID for the dashboard
      operationId: getAuthConfig
      x-aegis-permission: public
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
        default:
          $ref: '#/components/responses/Error'
  /api/v1/signing-key:
    get:
      tags:
      - audit
      summary: Public Ed25519 key that signs audit anchors and change sets
      operationId: getSigningKey
      x-aegis-permission: public
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicKey'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/me:
    get:
      tags:
      - access
      summary: The caller, and their roles in the tenant when the tenant header is sent
      operationId: getMe
      x-aegis-permission: signed
      parameters:
      - $ref: '#/components/parameters/TenantOptional'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/me/tenants:
    get:
      tags:
      - access
      summary: Tenants the caller holds a role in
      operationId: getMeTenants
      x-aegis-permission: signed
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Membership'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/access/bindings:
    get:
      tags:
      - access
      summary: Role bindings in the tenant
      operationId: getAccessBindings
      x-aegis-permission: admin
      parameters:
      - &id002
        $ref: '#/components/parameters/Tenant'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items: *id001
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - access
      summary: Grant a role
      operationId: postAccessBindings
      x-aegis-permission: admin
      parameters:
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindingChange'
      responses:
        '204':
          description: Done
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - access
      summary: Revoke a role (the last admin cannot be removed)
      operationId: deleteAccessBindings
      x-aegis-permission: admin
      parameters:
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindingChange'
      responses:
        '204':
          description: Done
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/tenant/policy-config:
    get:
      tags:
      - tenant
      summary: Tenant policy configuration
      operationId: getTenantPolicyConfig
      x-aegis-permission: read
      parameters:
      - *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyConfig'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags:
      - tenant
      summary: Replace the tenant policy configuration (audited)
      operationId: putTenantPolicyConfig
      x-aegis-permission: admin
      parameters:
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyConfig'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyConfig'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/admin/outbox/requeue:
    post:
      tags:
      - operations
      summary: Requeue parked outbox events
      operationId: postAdminOutboxRequeue
      x-aegis-permission: admin
      parameters:
      - *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/inventory/import:
    post:
      tags:
      - inventory
      summary: Import an inventory snapshot (aegis.inventory/v1)
      operationId: postInventoryImport
      x-aegis-permission: operate
      parameters:
      - *id002
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: *id001
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/inventory/import/terraform-state:
    post:
      tags:
      - inventory
      summary: Import a Terraform state v4 file as an inventory snapshot
      operationId: postInventoryImportTerraformState
      x-aegis-permission: operate
      parameters:
      - *id002
      - name: account_id
        in: query
        required: false
        description: '12-digit AWS account ID; default: the first one found in an ARN'
        schema:
          type: string
      - name: account_name
        in: query
        required: false
        description: Account display name
        schema:
          type: string
      - name: environment
        in: query
        required: false
        description: Environment for resources without an environment tag
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  import: *id001
                  skipped:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/inventory/imports/{id}:
    get:
      tags:
      - inventory
      summary: An import report
      operationId: getInventoryImportsById
      x-aegis-permission: read
      parameters:
      - *id002
      - &id003
        $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/resources:
    get:
      tags:
      - inventory
      summary: List resources (ordered by ID)
      operationId: getResources
      x-aegis-permission: read
      parameters:
      - *id002
      - name: type
        in: query
        required: false
        description: Resource type
        schema:
          type: string
      - name: environment
        in: query
        required: false
        description: Environment
        schema:
          type: string
      - name: account_id
        in: query
        required: false
        description: Account UUID
        schema:
          type: string
      - name: include_deleted
        in: query
        required: false
        description: Include deleted resources
        schema:
          type: boolean
      - &id004
        $ref: '#/components/parameters/Limit'
      - name: cursor
        in: query
        required: false
        description: next_cursor from the previous page
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: *id001
                  next_cursor:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/resources/types:
    get:
      tags:
      - inventory
      summary: Live resource types with counts
      operationId: getResourcesTypes
      x-aegis-permission: read
      parameters:
      - *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TypeCount'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/accounts:
    get:
      tags:
      - inventory
      summary: Cloud accounts with live resource counts
      operationId: getAccounts
      x-aegis-permission: read
      parameters:
      - $ref: '#/components/parameters/Tenant'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/resources/{id}:
    get:
      tags:
      - inventory
      summary: A resource with incoming edges and version history
      operationId: getResourcesById
      x-aegis-permission: read
      parameters:
      - *id002
      - *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/iac/fixtures:
    get:
      tags:
      - iac
      summary: Terraform fixtures a scan may use
      operationId: getIacFixtures
      x-aegis-permission: signed
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/iac/scans:
    post:
      tags:
      - iac
      summary: Queue a scan of a Terraform fixture
      operationId: postIacScans
      x-aegis-permission: operate
      parameters:
      - *id002
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequest'
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema: *id001
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    get:
      tags:
      - iac
      summary: List scans, newest first (without findings)
      operationId: getIacScans
      x-aegis-permission: read
      parameters:
      - *id002
      - *id004
      - &id005
        $ref: '#/components/parameters/After'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items: *id001
                  next_cursor:
                    type: string
                    description: Pass as `after` for the next page; empty on the last page.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/iac/scans/{id}:
    get:
      tags:
      - iac
      summary: A scan with planned changes and findings
      operationId: getIacScansById
      x-aegis-permission: read
      parameters:
      - *id002
      - *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/compliance/frameworks:
    get:
      tags:
      - compliance
      summary: Control frameworks and their controls
      operationId: getComplianceFrameworks
      x-aegis-permission: signed
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/compliance/evaluations:
    post:
      tags:
      - compliance
      summary: Evaluate the inventory (or an IaC scan) against the policies
      operationId: postComplianceEvaluations
      x-aegis-permission: operate
      parameters:
      - *id002
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: *id001
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/compliance/coverage:
    get:
      tags:
      - compliance
      summary: Control coverage
      operationId: getComplianceCoverage
      x-aegis-permission: read
      parameters:
      - *id002
      - name: scope
        in: query
        required: false
        description: inventory or iac
        schema:
          type: string
      - name: stale_after
        in: query
        required: false
        description: Duration after which evidence is stale
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/compliance/controls/{framework}/{control}:
    get:
      tags:
      - compliance
      summary: Evidence for one control
      operationId: getComplianceControlsById
      x-aegis-permission: read
      parameters:
      - *id002
      - name: framework
        in: path
        required: true
        description: Framework ID
        schema:
          type: string
      - name: control
        in: path
        required: true
        description: Control ID
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/compliance/exceptions:
    get:
      tags:
      - compliance
      summary: List policy exceptions
      operationId: getComplianceExceptions
      x-aegis-permission: read
      parameters:
      - *id002
      - *id004
      - *id005
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items: *id001
                  next_cursor:
                    type: string
                    description: Pass as `after` for the next page; empty on the last page.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - compliance
      summary: Request a policy exception
      operationId: postComplianceExceptions
      x-aegis-permission: operate
      parameters:
      - *id002
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExceptionRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: *id001
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/compliance/exceptions/{id}/approve:
    post:
      tags:
      - compliance
      summary: 'Approve an exception (four-eyes: not the requester)'
      operationId: postComplianceExceptionsApprove
      x-aegis-permission: approve
      parameters:
      - *id002
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/compliance/exceptions/{id}/reject:
    post:
      tags:
      - compliance
      summary: 'Reject an exception (four-eyes: not the requester)'
      operationId: postComplianceExceptionsReject
      x-aegis-permission: approve
      parameters:
      - *id002
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/compliance/exceptions/{id}/revoke:
    post:
      tags:
      - compliance
      summary: 'Revoke an exception (four-eyes: not the requester)'
      operationId: postComplianceExceptionsRevoke
      x-aegis-permission: approve
      parameters:
      - *id002
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/audit/events:
    get:
      tags:
      - audit
      summary: Audit events, newest first
      operationId: getAuditEvents
      x-aegis-permission: read
      parameters:
      - *id002
      - *id004
      - name: before_seq
        in: query
        required: false
        description: Return events before this sequence number
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/audit/verify:
    get:
      tags:
      - audit
      summary: Verify the tenant hash chain
      operationId: getAuditVerify
      x-aegis-permission: read
      parameters:
      - *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/audit/head:
    get:
      tags:
      - audit
      summary: Signed anchor for the current chain head
      operationId: getAuditHead
      x-aegis-permission: read
      parameters:
      - *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/audit/anchors/verify:
    post:
      tags:
      - audit
