name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --redact --verbose

  go-vulns:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  pip-audit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e . "pip-audit==2.10.1"
      - run: pip-audit --skip-editable

  npm-audit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high

  trivy-fs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: trivy filesystem + IaC scan
        run: >
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.58.1
          fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL
          --skip-dirs /src/datasets/terraform-fixtures --skip-dirs /src/services/iac/testdata --exit-code 1 /src
