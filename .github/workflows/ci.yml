name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.6-alpine3.21
        env:
          POSTGRES_DB: aegis_test
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis" --health-interval 5s
          --health-timeout 3s --health-retries 10
      # Free AWS emulator: the collector is tested against the real SDK calls.
      moto:
        image: motoserver/moto:5.2.5
        ports: ["5055:5000"]
    env:
      AEGIS_TEST_AWS_ENDPOINT: http://localhost:5055
      AEGIS_TEST_DATABASE_URL: postgres://aegis:ci-only@localhost:5432/aegis_test?sslmode=disable
      AEGIS_TEST_OPA_URL: http://localhost:8181
      AEGIS_TEST_OPA_TOKEN: ci-only-opa-token
      AEGIS_TEST_NATS_URL: nats://localhost:4222
      AEGIS_TEST_NATS_USER: aegis_api
      AEGIS_TEST_NATS_PASSWORD: ci-only-nats-password
    steps:
      - uses: actions/checkout@v4
      - name: start OPA with the repository policies
        run: |
          docker run -d --name opa -p 8181:8181 -e OPA_AUTH_TOKEN=ci-only-opa-token -v "$PWD/policies:/policies:ro" \
            openpolicyagent/opa:1.0.0-static run --server --addr=0.0.0.0:8181 \
            --authentication=token --authorization=basic /policies
          for i in $(seq 1 30); do curl -sf localhost:8181/health && break; sleep 1; done
      - name: start NATS with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 -e NATS_API_PASSWORD=ci-only-nats-password \
            -v "$PWD/infrastructure/nats/nats.conf:/etc/nats/nats.conf:ro" nats:2.10.24-alpine -c /etc/nats/nats.conf
          for i in $(seq 1 30); do curl -sf localhost:8222/healthz && break; sleep 1; done
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: test (unit + integration, race detector, combined coverage)
        # -coverpkg counts the integration tests too: much of the code that
        # talks to PostgreSQL, OPA and NATS is exercised only there.
        run: go test -race -count=1 -coverpkg=./services/...,./packages/... -coverprofile=coverage.out ./...
      - name: coverage summary
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          echo "Go statement coverage (unit + integration): **$total**" >> "$GITHUB_STEP_SUMMARY"
          echo "$total"
      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
      - run: go build ./...

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run api:check # src/api.gen.ts matches services/api/openapi.yaml
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  ml:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  policies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: opa fmt, check and test
        run: |
          docker run --rm -v "$PWD/policies:/policies:ro" openpolicyagent/opa:1.0.0-static fmt --list --fail /policies
          docker run --rm -v "$PWD/policies:/policies:ro" openpolicyagent/opa:1.0.0-static check --strict /policies
          docker run --rm -v "$PWD/policies:/policies:ro" openpolicyagent/opa:1.0.0-static test -v /policies

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infrastructure/docker/api.Dockerfile -t aegis-api:ci .
      - name: compose config
        run: POSTGRES_PASSWORD=ci AEGIS_OPA_TOKEN=ci AEGIS_NATS_PASSWORD=ci AEGIS_APP_DB_PASSWORD=ci docker compose --profile core config --quiet

  # Installs the Helm chart on a throwaway Kubernetes cluster (kind) with the
  # images built from this commit, then checks the deployment really works.
  kubernetes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: chart files match the Compose ones
        run: |
          diff infrastructure/postgres/init/10-app-role.sh deploy/helm/aegis/files/10-app-role.sh
          diff infrastructure/postgres/init/20-dex-db.sh deploy/helm/aegis/files/20-dex-db.sh
          diff infrastructure/nats/nats.conf deploy/helm/aegis/files/nats.conf
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1
      - name: lint and render (production settings)
        run: |
          helm lint deploy/helm/aegis --set host=aegis.example.org --set dex.enabled=true
          helm template t deploy/helm/aegis --set host=aegis.example.org --set dex.enabled=true \
            --set mlWorker.enabled=true > /tmp/prod.yaml
          # production must refuse an insecure configuration
          ! helm template t deploy/helm/aegis --set host=x.org --set api.authMode=dev-headers
          ! helm template t deploy/helm/aegis --set host=x.org
      - name: build images
        run: |
          for c in api web opa ml; do
            docker build -q -f infrastructure/docker/$c.Dockerfile -t ghcr.io/manishaacharyahere/aegis-cloud-governance/aegis-$c:ci .
          done
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          cluster_name: aegis
      - name: install the chart
        run: |
          for c in api web opa ml; do kind load docker-image ghcr.io/manishaacharyahere/aegis-cloud-governance/aegis-$c:ci --name aegis; done
          helm install aegis deploy/helm/aegis --namespace aegis --create-namespace \
            --set image.tag=ci --set image.pullPolicy=Never --set environment=development \
            --set api.authMode=dev-headers --set ingress.enabled=false --set mlWorker.enabled=true \
            --wait --timeout 6m
      - name: smoke test through the web front end
        run: |
          kubectl -n aegis port-forward svc/aegis-web 8080:8080 & sleep 3
          curl -sf localhost:8080/ | grep -q '<div id="root">'
          curl -sf localhost:8080/readyz | tee /dev/stderr | grep -q '"status":"ready"'
          curl -sfI localhost:8080/ | grep -qi content-security-policy
          h=(-H "X-Aegis-Tenant: demo" -H "X-Aegis-Actor: ci@aegis.local" -H "Content-Type: application/json")
          curl -sf "${h[@]}" -X POST --data @datasets/inventory/sample/snapshot-v1.json localhost:8080/api/v1/inventory/import | grep -q import_id
          curl -sf "${h[@]}" -X POST -d '{"source":"inventory"}' localhost:8080/api/v1/compliance/evaluations | tee /dev/stderr | grep -q run_id
      - name: diagnostics
        if: failure()
        run: |
          kubectl -n aegis get pods,jobs -o wide
          kubectl -n aegis describe pods | tail -80
          for p in $(kubectl -n aegis get pods -o name); do echo "== $p"; kubectl -n aegis logs $p --all-containers --tail=40; done
