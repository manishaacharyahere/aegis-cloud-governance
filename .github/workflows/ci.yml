name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.6-alpine3.21
        env:
          POSTGRES_DB: aegis_test
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      AEGIS_TEST_DATABASE_URL: postgres://aegis:ci-only@localhost:5432/aegis_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: test (unit + integration, race detector)
        run: go test -race -count=1 ./...
      - run: go build ./...

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  ml:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  policies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: opa fmt, check and test
        run: |
          docker run --rm -v "$PWD/policies:/policies:ro" openpolicyagent/opa:1.0.0-static fmt --list --fail /policies
          docker run --rm -v "$PWD/policies:/policies:ro" openpolicyagent/opa:1.0.0-static check --strict /policies
          docker run --rm -v "$PWD/policies:/policies:ro" openpolicyagent/opa:1.0.0-static test -v /policies

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infrastructure/docker/api.Dockerfile -t aegis-api:ci .
      - name: compose config
        run: POSTGRES_PASSWORD=ci docker compose --profile core config --quiet
