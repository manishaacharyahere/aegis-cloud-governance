name: release

# Publishes the deployable images to the GitHub Container Registry (free for
# public repositories) for linux/amd64 and linux/arm64 (Oracle Cloud's free
# Ampere VMs, Raspberry Pi, Graviton).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        component: [api, web, opa, ml]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: tags
        id: tags
        run: |
          image=ghcr.io/${{ github.repository }}/aegis-${{ matrix.component }}
          v=${GITHUB_REF_NAME#v}
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "list=$image:$v,$image:latest" >> "$GITHUB_OUTPUT"; else echo "list=$image:edge" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/${{ matrix.component }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: true
          sbom: true
