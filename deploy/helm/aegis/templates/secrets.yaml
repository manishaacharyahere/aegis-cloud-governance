{{- if not .Values.existingSecret }}
{{- /* Generated once; lookup keeps the same values on every upgrade. */}}
{{- $name := include "aegis.secret" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $keep := dict }}
{{- range $k := list "postgres-password" "app-db-password" "opa-token" "nats-password" "signing-key" }}
{{- $v := get $old $k }}
{{- if $v }}{{ $_ := set $keep $k ($v | b64dec) }}{{ end }}
{{- end }}
{{- $pg := get $keep "postgres-password" | default (randAlphaNum 32) }}
{{- $app := get $keep "app-db-password" | default (randAlphaNum 32) }}
{{- $host := printf "%s-postgres" (include "aegis.name" .) }}
{{- $ssl := ternary "require" "disable" .Values.postgresql.tls }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "aegis.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep # deleting the release must not lose the keys to the data
type: Opaque
stringData:
  postgres-password: {{ $pg | quote }}
  app-db-password: {{ $app | quote }}
  opa-token: {{ get $keep "opa-token" | default (randAlphaNum 48) | quote }}
  nats-password: {{ get $keep "nats-password" | default (randAlphaNum 32) | quote }}
  # base64 of a 32-byte Ed25519 seed, the format AEGIS_SIGNING_KEY expects
  signing-key: {{ get $keep "signing-key" | default (randBytes 32) | quote }}
  {{- if .Values.postgresql.enabled }}
  app-database-url: {{ printf "postgres://aegis_app:%s@%s:5432/aegis?sslmode=%s" $app $host $ssl | quote }}
  owner-database-url: {{ printf "postgres://aegis:%s@%s:5432/aegis?sslmode=%s" $pg $host $ssl | quote }}
  {{- end }}
{{- end }}
