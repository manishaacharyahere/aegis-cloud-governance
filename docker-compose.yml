# Aegis local environment.
#
#   docker compose --profile core up -d --build     # postgres, nats, opa, api
#   docker compose --profile core --profile ai up -d # + optional local model (Module G)
#   docker compose --profile core --profile auth up -d   # + Dex (local OIDC), see docs/auth.md
#   docker compose --profile core --profile ml up -d     # + scheduled ML worker (anomalies, forecasts)
#   docker compose --profile core --profile tls up -d    # + HTTPS on https://localhost:8443 (local CA)
#   docker compose --profile core --profile observability up -d
#                                       # + Prometheus :9090, Grafana :3000, Jaeger :16686
#
# The AI profile is optional: Aegis works fully without it. To use it, pull a
# model once (docker compose exec ollama ollama pull qwen2.5:3b) and set
# AEGIS_AI_PROVIDER=ollama and AEGIS_AI_MODEL in .env.
#
# All ports bind to 127.0.0.1 only. Credentials come from .env (see
# .env.example) and are for local development only.

name: aegis

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    <<: *hardening
    profiles: ["core"]
    image: postgres:16.6-alpine3.21
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      AEGIS_APP_DB_PASSWORD: ${AEGIS_APP_DB_PASSWORD:?set AEGIS_APP_DB_PASSWORD in .env}
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { memory: 512m }

  nats:
    <<: *hardening
    profiles: ["core"]
    image: nats:2.10.24-alpine
    # Anonymous access is off; see infrastructure/nats/nats.conf.
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      NATS_API_PASSWORD: ${AEGIS_NATS_PASSWORD:?set AEGIS_NATS_PASSWORD in .env}
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]
    volumes: ["natsdata:/data", "./infrastructure/nats/nats.conf:/etc/nats/nats.conf:ro"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s # JetStream recovers its store before it reports healthy
    deploy:
      resources:
        limits: { memory: 256m }

  opa:
    <<: *hardening
    profiles: ["core"]
    image: openpolicyagent/opa:1.0.0-static
    # Token authentication plus policies/system/authz.rego: only evaluation is
    # allowed, and policies can never be changed through the API.
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-format=json",
              "--authentication=token", "--authorization=basic", "/policies"]
    environment:
      OPA_AUTH_TOKEN: ${AEGIS_OPA_TOKEN:?set AEGIS_OPA_TOKEN in .env}
    ports: ["127.0.0.1:8181:8181"]
    volumes: ["./policies:/policies:ro"]
    read_only: true
    user: "65532:65532"
    deploy:
      resources:
        limits: { memory: 256m }

  # One-shot job: applies migrations as the schema owner, then exits. The API
  # starts after it succeeded and never receives the owner credentials.
  migrate:
    <<: *hardening
    profiles: ["core"]
    image: aegis-api:local
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: ["migrate"]
    restart: "no"
    environment:
      AEGIS_ENV: development
      AEGIS_DATABASE_URL: postgres://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aegis}?sslmode=disable
      AEGIS_MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aegis}?sslmode=disable
    read_only: true
    depends_on:
      postgres: { condition: service_healthy }

  api:
    # Longer than the service's own shutdown budget, so it can drain.
    stop_grace_period: 20s
    <<: *hardening
    profiles: ["core"]
    image: aegis-api:local
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      AEGIS_ENV: development
      AEGIS_LOG_LEVEL: ${AEGIS_LOG_LEVEL:-info}
      AEGIS_OPA_URL: http://opa:8181
      AEGIS_OPA_TOKEN: ${AEGIS_OPA_TOKEN}
      AEGIS_SIGNING_KEY: ${AEGIS_SIGNING_KEY:-}
      AEGIS_NATS_URL: nats://nats:4222
      AEGIS_NATS_USER: aegis_api
      AEGIS_NATS_PASSWORD: ${AEGIS_NATS_PASSWORD}
      AEGIS_METRICS_ADDR: ":9464"
      # Inside the container the API listens on all interfaces; the host port
      # below is bound to 127.0.0.1, so only this machine reaches it.
      AEGIS_HTTP_ADDR: ":8080"
      AEGIS_DEV_TRUST_PRIVATE_NETWORK: "true"
      AEGIS_AUTH_MODE: ${AEGIS_AUTH_MODE:-dev-headers}
      AEGIS_OIDC_ISSUER: ${AEGIS_OIDC_ISSUER:-http://dex.localhost:5556/dex}
      AEGIS_OIDC_CLIENT_ID: ${AEGIS_OIDC_CLIENT_ID:-aegis-web}
      AEGIS_BOOTSTRAP_ADMINS: ${AEGIS_BOOTSTRAP_ADMINS:-}
      # Set AEGIS_OTLP_ENDPOINT=http://jaeger:4318 in .env with the observability profile to export traces.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${AEGIS_OTLP_ENDPOINT:-}
      # Least-privilege aegis_app role only; the migrate job ran the migrations.
      AEGIS_DATABASE_URL: postgres://aegis_app:${AEGIS_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-aegis}?sslmode=disable
      AEGIS_MIGRATE_ON_START: "false"
      AEGIS_AI_PROVIDER: ${AEGIS_AI_PROVIDER:-none}
      AEGIS_AI_URL: http://ollama:11434
      AEGIS_AI_MODEL: ${AEGIS_AI_MODEL:-}
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      opa: { condition: service_started }
    deploy:
      resources:
        limits: { memory: 768m } # cost imports up to 64 MiB are parsed in memory

  ollama:
    <<: *hardening
    profiles: ["ai"]
    image: ollama/ollama:0.40.12
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ollamadata:/root/.ollama"]
    deploy:
      resources:
        limits: { memory: 6g }

  dex:
    <<: *hardening
    profiles: ["auth"]
    image: ghcr.io/dexidp/dex:v2.46.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports: ["127.0.0.1:5556:5556"]
    volumes: ["./infrastructure/auth/dex.yml:/etc/dex/config.yaml:ro"]
    environment:
      DEX_DB_USER: ${POSTGRES_USER:-aegis}
      DEX_DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      default:
        aliases: ["dex.localhost"]
    read_only: true
    tmpfs: ["/tmp"]
    deploy:
      resources:
        limits: { memory: 128m }

  ml-worker:
    # Longer than the service's own shutdown budget, so it can drain.
    stop_grace_period: 60s
    <<: *hardening
    profiles: ["ml"]
    build:
      context: .
      dockerfile: infrastructure/docker/ml.Dockerfile
    # Anomaly detection and forecasting for one tenant, repeated on a schedule.
    command: ["--tenant", "${AEGIS_ML_TENANT:-demo}", "--every", "${AEGIS_ML_EVERY:-6h}"]
    environment:
      AEGIS_DATABASE_URL: postgresql://aegis_app:${AEGIS_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-aegis}
    read_only: true
    tmpfs: ["/tmp"]
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 1g }

  caddy:
    <<: *hardening
    profiles: ["tls"]
    image: caddy:2.11.7-alpine
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./infrastructure/tls/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [api]
    deploy:
      resources:
        limits: { memory: 128m }

  prometheus:
    <<: *hardening
    profiles: ["observability"]
    image: prom/prometheus:v3.15.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    deploy:
      resources:
        limits: { memory: 512m }

  grafana:
    <<: *hardening
    profiles: ["observability"]
    image: grafana/grafana:13.2.5
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus]
    deploy:
      resources:
        limits: { memory: 512m }

  jaeger:
    <<: *hardening
    profiles: ["observability"]
    image: jaegertracing/jaeger:2.22.0
    ports: ["127.0.0.1:16686:16686"]   # UI only; OTLP (4318) stays on the internal network
    deploy:
      resources:
        limits: { memory: 512m }

volumes:
  caddydata:
  caddyconfig:
  pgdata:
  promdata:
  grafanadata:
  natsdata:
  ollamadata:
