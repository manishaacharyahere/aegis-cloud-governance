[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ml"
version = "0.2.0"
description = "Aegis FinOps forecasting, anomaly detection and synthetic data generation"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.5",
  "pandas==3.1.1",
  "statsmodels==0.15.0",
  "scikit-learn==1.9.1",
  "psycopg[binary]==3.3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["aegis_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311"]
